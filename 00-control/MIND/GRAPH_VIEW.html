<head>

<style>
  :root{--bg:#080C14;--surf:#0F1626;--card:#141D30;--bdr:#1E2C48;--txt:#F1F5F9;--muted:#64748B;--dim:#94A3B8;--gold:#F59E0B;--cyan:#06B6D4;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
  header{padding:14px 24px;background:rgba(8,12,20,.95);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .brand{font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;}
  .stats{font-size:12px;color:var(--muted);font-family:monospace;}
  .main{display:flex;flex:1;overflow:hidden;}
  #graph{flex:1;}
  #sidebar{width:340px;background:var(--surf);border-left:1px solid var(--bdr);padding:24px;overflow-y:auto;flex-shrink:0;}
  #sidebar h2{font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px;}
  #node-detail{display:none;}
  #node-detail .nd-title{font-size:18px;font-weight:700;color:var(--txt);margin-bottom:8px;line-height:1.3;}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin:2px;letter-spacing:.06em;}
  .nd-thought{font-size:13px;color:var(--dim);line-height:1.7;margin:14px 0;background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:12px;}
  .nd-meta{font-size:12px;color:var(--muted);font-family:monospace;line-height:2;}
  .nd-connections{margin-top:16px;}
  .nd-connections h3{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
  .conn-item{font-size:12px;padding:6px 10px;background:var(--card);border:1px solid var(--bdr);border-radius:6px;margin-bottom:4px;cursor:pointer;transition:border-color .2s;}
  .conn-item:hover{border-color:var(--cyan);}
  #empty-state{color:var(--muted);font-size:13px;line-height:1.8;}
  .legend{margin-top:24px;padding-top:18px;border-top:1px solid var(--bdr);}
  .legend h3{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
  .leg-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-bottom:6px;}
  .leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  svg .node-circle{cursor:pointer;transition:stroke-width .2s;}
  svg .node-circle:hover{stroke-width:3;}
  svg .node-label{pointer-events:none;}
  .tooltip{position:fixed;background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:10px 14px;font-size:12px;pointer-events:none;z-index:100;display:none;max-width:220px;line-height:1.6;}
</style>
</head>

const TYPE_COLORS = {"FLEETING": "#64748B", "INSPIRATION": "#06B6D4", "MACRO": "#F59E0B", "INSIGHT": "#10B981", "QUESTION": "#8B5CF6"};
const EDGE_COLORS = {"SUPPORTS": "#10B981", "CONTRADICTS": "#EF4444", "EXTENDS": "#06B6D4", "SPAWNS": "#F59E0B", "REQUIRES": "#8B5CF6", "PARALLEL": "#64748B", "MERGES_INTO": "#F97316"};

const nodeMap = {};
GRAPH.nodes.forEach(n => nodeMap[n.id] = n);

// Build legend
const lt = document.getElementById('legend-types');
Object.entries(TYPE_COLORS).forEach(([t,c]) => {
  lt.innerHTML += `<div class="leg-item"><div class="leg-dot" style="background:${c}"></div>${t}</div>`;
});
const le = document.getElementById('legend-edges');
Object.entries(EDGE_COLORS).forEach(([t,c]) => {
  le.innerHTML += `<div class="leg-item"><div class="leg-dot" style="background:${c};border-radius:2px;"></div>${t}</div>`;
});

// D3 setup
const svg = d3.select('#graph');
const container = svg.append('g');

function resize() {
  const el = document.getElementById('graph');
  return { w: el.clientWidth, h: el.clientHeight };
}

let {w, h} = resize();

// Arrow markers
const defs = svg.append('defs');
Object.entries(EDGE_COLORS).forEach(([type, color]) => {
  defs.append('marker')
    .attr('id', 'arr-' + type)
    .attr('viewBox', '0 -4 8 8')
    .attr('refX', 22).attr('refY', 0)
    .attr('markerWidth', 6).attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path').attr('d', 'M0,-4L8,0L0,4').attr('fill', color);
});

const simulation = d3.forceSimulation(GRAPH.nodes)
  .force('link', d3.forceLink(GRAPH.links).id(d => d.id).distance(160).strength(0.4))
  .force('charge', d3.forceManyBody().strength(-400))
  .force('center', d3.forceCenter(w/2, h/2))
  .force('collision', d3.forceCollide().radius(50));

// Links
const link = container.append('g').selectAll('line')
  .data(GRAPH.links).join('line')
  .attr('stroke', d => d.color)
  .attr('stroke-opacity', 0.6)
  .attr('stroke-width', 1.5)
  .attr('marker-end', d => `url(#arr-${d.type})`);

// Node groups
const nodeGroup = container.append('g').selectAll('g')
  .data(GRAPH.nodes).join('g')
  .attr('class', 'node-g')
  .call(d3.drag()
    .on('start', (e,d) => { if(!e.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag',  (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on('end',   (e,d) => { if(!e.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }));

// Connection count for sizing
const connCount = {};
GRAPH.nodes.forEach(n => connCount[n.id] = 0);
GRAPH.links.forEach(l => { connCount[l.source.id||l.source]++; connCount[l.target.id||l.target]++; });

nodeGroup.append('circle')
  .attr('class', 'node-circle')
  .attr('r', d => 16 + (connCount[d.id]||0) * 4)
  .attr('fill', d => d.color)
  .attr('fill-opacity', d => d.opacity)
  .attr('stroke', d => d.color)
  .attr('stroke-width', 2)
  .attr('stroke-opacity', 0.8);

nodeGroup.append('text')
  .attr('class', 'node-label')
  .attr('text-anchor', 'middle')
  .attr('dy', '.35em')
  .attr('fill', '#fff')
  .attr('font-size', '11px')
  .attr('font-weight', '700')
  .text(d => d.id);

// Tooltip
const tooltip = document.getElementById('tooltip');
nodeGroup
  .on('mouseenter', (e, d) => {
    tooltip.style.display = 'block';
    tooltip.innerHTML = `<strong>${d.id}</strong><br>${d.title}<br><span style="color:${d.color};font-size:10px;">${d.type} · ${d.status}</span>`;
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top  = (e.clientY - 10) + 'px';
  })
  .on('mousemove', e => { tooltip.style.left=(e.clientX+14)+'px'; tooltip.style.top=(e.clientY-10)+'px'; })
  .on('mouseleave', () => { tooltip.style.display='none'; })
  .on('click', (e, d) => showDetail(d));

// Node detail panel
function showDetail(node) {
  document.getElementById('empty-state').style.display = 'none';
  const panel = document.getElementById('node-detail');
  panel.style.display = 'block';
  const conns = GRAPH.links
    .filter(l => (l.source.id||l.source)===node.id || (l.target.id||l.target)===node.id)
    .map(l => {
      const otherId = (l.source.id||l.source)===node.id ? (l.target.id||l.target) : (l.source.id||l.source);
      const dir = (l.source.id||l.source)===node.id ? '→' : '←';
      return `<div class="conn-item" onclick="showDetail(nodeMap['${otherId}'])">
        <span style="color:${l.color};font-weight:700">${l.type}</span> ${dir} ${otherId}
        <span style="color:var(--dim);float:right">${(nodeMap[otherId]||{}).title||''}</span>
      </div>`;
    }).join('');
  const tagBadges = (node.tags||[]).map(t =>
    `<span class="badge" style="background:rgba(100,116,139,.2);color:var(--dim);border:1px solid var(--bdr);">#${t}</span>`).join('');
  panel.innerHTML = `
    <div class="nd-title">${node.title}</div>
    <div style="margin-bottom:10px;">
      <span class="badge" style="background:${node.color}22;color:${node.color};border:1px solid ${node.color}55;">${node.type}</span>
      <span class="badge" style="background:rgba(255,255,255,.05);color:var(--dim);border:1px solid var(--bdr);">${node.status}</span>
      ${tagBadges}
    </div>
    <div class="nd-thought">${node.thought || 'No preview available.'}</div>
    <div class="nd-meta">
      ID: ${node.id}<br>
      Created: ${node.created}<br>
      ${node.repo_target ? 'Repo target: '+node.repo_target+'<br>' : ''}
      ${node.cluster ? 'Cluster: '+node.cluster+'<br>' : ''}
    </div>
    <div class="nd-connections">
      <h3>Connections (${conns ? GRAPH.links.filter(l=>(l.source.id||l.source)===node.id||(l.target.id||l.target)===node.id).length : 0})</h3>
      ${conns || '<div style="color:var(--muted);font-size:12px;padding:8px 0;">No connections yet</div>'}
    </div>
  `;
  // Highlight selected
  nodeGroup.selectAll('circle').attr('stroke-width', d2 => d2.id===node.id ? 4 : 2);
}

simulation.on('tick', () => {
  link
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  nodeGroup.attr('transform', d => `translate(${d.x},${d.y})`);
});

// Zoom + pan
svg.call(d3.zoom().scaleExtent([0.3, 3]).on('zoom', e => container.attr('transform', e.transform)));

window.addEventListener('resize', () => {
  const s = resize(); simulation.force('center', d3.forceCenter(s.w/2, s.h/2)).alpha(0.1).restart();
});
</script>
</body>
</html>
